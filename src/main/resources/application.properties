spring.application.name=api-gateway

server.port=8080

logging.level.org.springframework.cloud.gateway=DEBUG
logging.level.reactor.netty=DEBUG
management.endpoints.web.exposure.include=*

eureka.client.service-url.defaultZone=http://localhost:8761/eureka
spring.cloud.gateway.server.webflux.discovery.locator.enabled=true
spring.cloud.gateway.server.webflux.discovery.locator.lower-case-service-id=true
spring.main.web-application-type=reactive


spring.cloud.gateway.server.webflux.routes[0].id=auth-service
spring.cloud.gateway.server.webflux.routes[0].uri=lb://auth-service
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/auth/**

spring.cloud.gateway.server.webflux.routes[1].id=user-service
spring.cloud.gateway.server.webflux.routes[1].uri=lb://user-service
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/users/**

spring.cloud.gateway.server.webflux.routes[2].id=community-service
spring.cloud.gateway.server.webflux.routes[2].uri=lb://community-service
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/communities/**

spring.cloud.gateway.server.webflux.routes[3].id=food-service
spring.cloud.gateway.server.webflux.routes[3].uri=lb://food-service
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/api/food/**

spring.cloud.gateway.server.webflux.routes[4].id=payment-service
spring.cloud.gateway.server.webflux.routes[4].uri=lb://payment-service
spring.cloud.gateway.server.webflux.routes[4].predicates[0]=Path=/api/payment/**

spring.cloud.gateway.server.webflux.routes[5].id=order-service
spring.cloud.gateway.server.webflux.routes[5].uri=lb://order-service
spring.cloud.gateway.server.webflux.routes[5].predicates[0]=Path=/api/foodRequests/**

spring.cloud.gateway.server.webflux.routes[6].id=config-service
spring.cloud.gateway.server.webflux.routes[6].uri=lb://config-service
spring.cloud.gateway.server.webflux.routes[6].predicates[0]=Path=/**
